<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartKids – Admin Login</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { background:linear-gradient(160deg,#e0f0ff,#f0f8ff,#e0f0ff); min-height:100vh; }
    .bg-deco { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
    .bg-deco span { position:absolute; font-size:2rem; opacity:.1; animation:bob 6s ease-in-out infinite; }
    .bg-deco span:nth-child(1){top:10%;left:5%;}
    .bg-deco span:nth-child(2){top:70%;left:8%;animation-delay:1s;}
    .bg-deco span:nth-child(3){top:20%;right:6%;animation-delay:2s;}
    .bg-deco span:nth-child(4){top:65%;right:10%;animation-delay:.5s;}
    .bg-deco span:nth-child(5){top:40%;left:3%;animation-delay:1.5s;font-size:1.4rem;}
    .bg-deco span:nth-child(6){top:50%;right:4%;animation-delay:2.5s;font-size:1.4rem;}
    .center-wrap { position:relative; z-index:2; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height: calc(100vh - 64px); padding:20px; }
    .back-link { font-size: .9rem; font-weight: 700; color: var(--gray); text-decoration: none; margin-bottom: 16px; transition: color .2s; }
    .back-link:hover { color: var(--blue-mid); }
    .auth-card { background:white; border-radius:20px; border:1px solid var(--border); box-shadow:0 8px 32px rgba(37,99,235,.12); padding:36px 40px; width:100%; max-width:400px; animation:floatUp .4s ease; }
    .admin-icon { text-align:center; font-size:3.5rem; margin-bottom:12px; }
    .auth-title { font-family:'Nunito',sans-serif; font-size:1.6rem; font-weight:900; color:var(--blue-mid); text-align:center; margin-bottom:24px; }
    .form-group { margin-bottom:16px; }
  </style>
</head>
<body>
<div class="bg-deco">
  <span>🎓</span><span>📚</span><span>⭐</span><span>✏️</span><span>📖</span><span>💡</span>
</div>

<nav>
  <a href="Home.html" class="logo">
    <img src="../Elements/LOGO-removebg-preview.png" alt="SmartKids Logo" style="height: 85px; width: auto;">
  </a>
  <div class="search-bar">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input type="text" id="navSearch" placeholder="Search Courses" 
           ondblclick="window.location.href='search.html';"
           onkeydown="if(event.key==='Enter') window.location.href='search.html?q=' + encodeURIComponent(this.value);"/>
  </div>
  <div class="nav-right">
    <a href="members.html" class="nav-link">Members</a>
    <a href="search.html" class="nav-link">COURSES</a>
    <a href="login.html" class="nav-link">LOG-IN / SIGN-UP</a>
    <a href="admin-login.html" title="Admin">
      <img src="../Elements/Admin_logo-removebg-preview.png" alt="Admin Logo" style="height: 40px; width: auto;">
    </a>
  </div>
</nav>

<div class="center-wrap">
  <a href="Home.html" class="back-link">‹ Homepage</a>
  <div class="auth-card">
    <div class="admin-icon">
      <img src="../Elements/Admin_logo-removebg-preview.png" alt="Admin Logo" style="height: 90px; width: auto;">
    </div>
    <h2 class="auth-title">ADMIN LOGIN</h2>
    <div class="form-group">
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" class="form-control" placeholder="Username" id="adminUser"/>
      </div>
    </div>
    <div class="form-group">
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" class="form-control" placeholder="Password" id="adminPwd"/>
        <span class="input-eye" onclick="togglePwd()">👁️</span>
      </div>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="doLogin()">LOGIN</button>
  </div>
</div>

<script>
function togglePwd() {
  const el = document.getElementById('adminPwd');
  el.type = el.type === 'password' ? 'text' : 'password';
}
function doLogin() {
  const u = document.getElementById('adminUser').value;
  const p = document.getElementById('adminPwd').value;
  if (u && p) { window.location.href = 'admin.html'; }
  else { alert('Please enter username and password.'); }
}
</script>
</body>
</html>
