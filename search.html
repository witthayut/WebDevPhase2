<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartKids – Search Courses</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* ── Page layout ── */
    .page-wrap { max-width:900px; margin:40px auto; padding:0 24px 80px; }
    .page-title {
      font-family:'Nunito',sans-serif;
      font-size:1.8rem; font-weight:900;
      color:var(--blue-mid); text-align:center; margin-bottom:28px;
    }

    /* ── Filter box ── */
    .filter-box {
      background:white; border-radius:16px;
      border:1px solid var(--border); padding:24px 28px;
      margin-bottom:32px; box-shadow:var(--shadow);
    }
    .filter-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px 24px; }
    .filter-group label {
      font-size:.82rem; font-weight:600;
      color:var(--gray); display:block; margin-bottom:6px;
    }
    .filter-group input,
    .filter-group select {
      width:100%; padding:9px 12px;
      border:1px solid var(--border); border-radius:8px;
      font-size:.85rem; font-family:'Poppins',sans-serif;
      background:var(--gray-light); outline:none;
      transition:border-color .2s;
    }
    .filter-group input:focus,
    .filter-group select:focus { border-color:var(--blue-mid); background:white; }
    .radio-row { display:flex; align-items:center; gap:16px; margin-top:0; }
    .radio-label {
      display:flex; align-items:center; gap:6px;
      font-size:.85rem; cursor:pointer; color:var(--dark);
    }
    .filter-actions { text-align:right; margin-top:16px; display:flex; gap:10px; justify-content:flex-end; }

    /* ── Results header ── */
    .results-header {
      display:flex; align-items:center;
      justify-content:space-between; margin-bottom:16px;
    }
    .results-title {
      font-family:'Nunito',sans-serif; font-size:1.1rem;
      font-weight:800; color:var(--blue-mid);
    }
    .results-count {
      font-size:.82rem; color:var(--gray);
      background:var(--gray-light); padding:3px 12px;
      border-radius:999px; font-weight:600;
    }

    /* ── Course card ── */
    .result-card {
      display:flex; align-items:center; gap:20px;
      background:white; border:1px solid var(--border);
      border-radius:14px; padding:16px 20px; margin-bottom:14px;
      text-decoration:none; color:inherit;
      transition:transform .2s, box-shadow .2s;
      box-shadow:var(--shadow);
    }
    .result-card:hover {
      transform:translateX(4px);
      box-shadow:0 6px 20px rgba(37,99,235,.12);
    }
    .result-thumb {
      width:96px; height:72px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      font-size:2rem; flex-shrink:0; overflow:hidden;
    }
    .result-thumb img { width:100%; height:100%; object-fit:cover; border-radius:10px; }
    .result-info { flex:1; min-width:0; }
    .result-info h3 {
      font-size:1rem; font-weight:700;
      color:var(--blue-mid); margin-bottom:3px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .result-instructor { font-size:.78rem; color:var(--gray); margin-bottom:5px; }
    .result-info .stars { font-size:.85rem; color:var(--yellow); }
    .result-desc {
      font-size:.78rem; color:var(--gray);
      display:-webkit-box; -webkit-line-clamp:2;
      -webkit-box-orient:vertical; overflow:hidden;
      margin-top:4px; line-height:1.5;
    }
    .result-meta {
      text-align:right; display:flex;
      flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0;
    }
    .badge {
      background:var(--blue-light); color:var(--blue);
      font-size:.75rem; font-weight:600;
      padding:3px 10px; border-radius:999px;
    }
    .price-tag {
      background:var(--blue-mid); color:white;
      font-size:.8rem; font-weight:700;
      padding:4px 12px; border-radius:999px;
    }
    .price-free {
      background:#dcfce7; color:#16a34a;
      font-size:.8rem; font-weight:700;
      padding:4px 12px; border-radius:999px;
    }

    /* ── State messages ── */
    .state-box {
      display:flex; flex-direction:column;
      justify-content:center; align-items:center;
      min-height:220px; gap:12px;
      font-family:'Nunito',sans-serif;
      background:white; border-radius:16px;
      border:1px dashed var(--border); margin-top:8px;
    }
    .state-box .state-icon { font-size:2.8rem; }
    .state-box .state-msg {
      font-size:1.1rem; font-weight:800; color:var(--gray);
    }
    .state-box .state-sub { font-size:.82rem; color:var(--gray); }

    /* ── Loading spinner ── */
    .spinner {
      width:36px; height:36px; border:3px solid var(--blue-light);
      border-top-color:var(--blue-mid); border-radius:50%;
      animation:spin .7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Skeleton loader ── */
    .skeleton-card {
      display:flex; gap:20px; align-items:center;
      background:white; border:1px solid var(--border);
      border-radius:14px; padding:16px 20px; margin-bottom:14px;
    }
    .skel {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size:200% 100%;
      animation:shimmer 1.4s infinite;
      border-radius:8px;
    }
    @keyframes shimmer { to { background-position:-200% 0; } }
    .skel-thumb { width:96px; height:72px; border-radius:10px; flex-shrink:0; }
    .skel-body { flex:1; display:flex; flex-direction:column; gap:8px; }
    .skel-line { height:12px; }
    .skel-short { width:55%; }
    .skel-long  { width:85%; }
    .skel-mid   { width:70%; }
  </style>
</head>
<body>

<!-- ── NAV ── -->
<nav>
  <a href="Home.html" class="logo">
    <img src="../Elements/LOGO-removebg-preview.png" alt="SmartKids Logo" style="height:85px;width:auto;">
  </a>
  <div class="search-bar">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input type="text" id="navSearch" placeholder="Search Courses"
      ondblclick="window.location.href='search.html';"
      onkeydown="if(event.key==='Enter'){syncAndSearch(this.value);}"/>
  </div>
  <div class="nav-right">
    <a href="members.html" class="nav-link">Members</a>
    <a href="search.html"  class="nav-link">COURSES</a>
    <a href="login.html"   class="nav-link">LOG-IN / SIGN-UP</a>
    <a href="admin-login.html" title="Admin">
      <img src="../Elements/Admin_logo-removebg-preview.png" alt="Admin" style="height:40px;width:auto;">
    </a>
  </div>
</nav>

<!-- ── MAIN ── -->
<div class="page-wrap">
  <h1 class="page-title">Online Course Search</h1>

  <!-- Filter box -->
  <div class="filter-box">
    <div class="filter-grid">

      <!-- Keyword -->
      <div class="filter-group">
        <label>Course Name / Keyword</label>
        <input type="text" id="filterName" placeholder="e.g. JavaScript"
          onkeydown="if(event.key==='Enter') doSearch();"/>
      </div>

      <!-- Category dropdown (populated from API) -->
      <div class="filter-group">
        <label>Category</label>
        <select id="filterCat">
          <option value="">All Categories</option>
        </select>
      </div>

      <!-- Rating -->
      <div class="filter-group">
        <label>Minimum Rating</label>
        <select id="filterRating">
          <option value="">Any Rating</option>
          <option value="3">3★ &amp; above</option>
          <option value="4">4★ &amp; above</option>
          <option value="4.5">4.5★ &amp; above</option>
        </select>
      </div>

      <!-- Price -->
      <div class="filter-group">
        <label>Price</label>
        <div class="radio-row">
          <label class="radio-label"><input type="radio" name="price" value="all" checked> All</label>
          <label class="radio-label"><input type="radio" name="price" value="free"> Free</label>
          <label class="radio-label"><input type="radio" name="price" value="paid"> Paid</label>
        </div>
      </div>

    </div>

    <div class="filter-actions">
      <button class="btn btn-secondary btn-sm" onclick="clearFilters()">Clear</button>
      <button class="btn btn-primary btn-sm" onclick="doSearch()">Search</button>
    </div>
  </div>

  <!-- Results -->
  <div class="results-header">
    <div class="results-title" id="resultsTitle">Courses</div>
    <div class="results-count" id="resultsCount" style="display:none;"></div>
  </div>
  <div id="results"></div>
</div>

<!-- ── FOOTER ── -->
<footer>
  <a href="Home.html" class="logo">
    <img src="../Elements/LOGO-removebg-preview.png" alt="SmartKids Logo" style="height:95px;width:auto;">
  </a>
  <div class="footer-contact">
    <p><strong>For inquiries, please contact (Admin)</strong></p>
    <p>Tel xxx-xxx-xxxx</p>
    <p>From 10:00 AM to 8:00 PM.</p>
  </div>
  <div class="footer-links">
    <a href="#">Privacy Notice</a>
    <a href="members.html">Team Member</a>
    <a href="#">Contact Us</a>
  </div>
</footer>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const API_BASE = "http://localhost:5000";

// Emoji fallback icons per category
const CATEGORY_ICON = {
  WebDev:   { icon:'🌐', bg:'linear-gradient(135deg,#1e3a5f,#2563eb)' },
  Coding:   { icon:'💻', bg:'linear-gradient(135deg,#1a2a3a,#0ea5e9)' },
  Backend:  { icon:'⚙️', bg:'linear-gradient(135deg,#1a1a2e,#7c3aed)' },
  Frontend: { icon:'🎨', bg:'linear-gradient(135deg,#2a1a3a,#db2777)' },
  Database: { icon:'🗄️', bg:'linear-gradient(135deg,#1a2a1a,#16a34a)' },
  Design:   { icon:'✏️', bg:'linear-gradient(135deg,#3a2a1a,#d97706)' },
  Analysis: { icon:'📊', bg:'linear-gradient(135deg,#1a3a3a,#0891b2)' },
};
const DEFAULT_ICON = { icon:'📚', bg:'linear-gradient(135deg,#1e293b,#64748b)' };

// ── Helpers ───────────────────────────────────────────────────────────────────
function getCategoryMeta(cat) {
  return CATEGORY_ICON[cat] || DEFAULT_ICON;
}

function starsHTML(rating) {
  if (rating == null) return '<span style="color:var(--gray);font-size:.78rem;">No rating yet</span>';
  const full  = Math.floor(rating);
  const half  = rating - full >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  return `<span class="stars">${'★'.repeat(full)}${'½'.repeat(half)}${'☆'.repeat(empty)}</span>
          <span style="font-size:.78rem;color:var(--gray);margin-left:4px;">${Number(rating).toFixed(1)}</span>`;
}

function priceHTML(price) {
  if (price === 0) return `<span class="price-free">Free</span>`;
  return `<span class="price-tag">฿${Number(price).toLocaleString()}</span>`;
}

function renderCard(c) {
  const meta = getCategoryMeta(c.subjectCategory);
  const thumb = c.imageOfSubject && c.imageOfSubject.startsWith('http')
    ? `<img src="${c.imageOfSubject}" alt="${c.nameCourse}" onerror="this.parentElement.innerHTML='${meta.icon}'">`
    : meta.icon;

  return `
    <a href="description.html?id=${encodeURIComponent(c.idCourse)}&name=${encodeURIComponent(c.nameCourse)}"
       class="result-card fade-in">
      <div class="result-thumb" style="background:${meta.bg}">${thumb}</div>
      <div class="result-info">
        <h3>${escHtml(c.nameCourse)}</h3>
        <div class="result-instructor">by ${escHtml(c.instructorName)}</div>
        <div>${starsHTML(c.rating)}</div>
        <div class="result-desc">${escHtml(c.description)}</div>
      </div>
      <div class="result-meta">
        <span class="badge">${escHtml(c.subjectCategory)}</span>
        ${priceHTML(c.price)}
        <span class="btn btn-primary btn-sm">View Details</span>
      </div>
    </a>`;
}

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function skeletonHTML(n = 3) {
  return Array.from({length: n}, () => `
    <div class="skeleton-card">
      <div class="skel skel-thumb"></div>
      <div class="skel-body">
        <div class="skel skel-line skel-short"></div>
        <div class="skel skel-line skel-long"></div>
        <div class="skel skel-line skel-mid"></div>
      </div>
    </div>`).join('');
}

function showLoading() {
  document.getElementById('results').innerHTML = skeletonHTML(4);
  document.getElementById('resultsCount').style.display = 'none';
}

function showError(msg) {
  document.getElementById('results').innerHTML = `
    <div class="state-box fade-in">
      <div class="state-icon">⚠️</div>
      <div class="state-msg">Could not load courses</div>
      <div class="state-sub">${escHtml(msg)}</div>
      <button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="doSearch()">Try Again</button>
    </div>`;
  setCount(null);
}

function showEmpty() {
  document.getElementById('results').innerHTML = `
    <div class="state-box fade-in">
      <div class="state-icon">🔍</div>
      <div class="state-msg">No courses found</div>
      <div class="state-sub">Try different keywords or remove some filters.</div>
    </div>`;
  setCount(0);
}

function setCount(n) {
  const el = document.getElementById('resultsCount');
  if (n === null) { el.style.display = 'none'; return; }
  el.textContent = `${n} result${n !== 1 ? 's' : ''}`;
  el.style.display = 'inline-block';
}

// ── Category dropdown ─────────────────────────────────────────────────────────
async function loadCategories() {
  try {
    const res  = await fetch(`${API_BASE}/api/courses/categories`);
    const data = await res.json();
    if (!data.success) return;
    const sel = document.getElementById('filterCat');
    data.categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      sel.appendChild(opt);
    });
  } catch (_) {
    // fail silently – user can still type keywords
  }
}

// ── Main search ───────────────────────────────────────────────────────────────
async function doSearch() {
  const name   = document.getElementById('filterName').value.trim();
  const cat    = document.getElementById('filterCat').value;
  const rating = document.getElementById('filterRating').value;
  const price  = document.querySelector('input[name="price"]:checked').value;

  // Keep nav search bar in sync
  document.getElementById('navSearch').value = name;

  // Update page title
  const hasFilter = name || cat || rating || price !== 'all';
  document.getElementById('resultsTitle').textContent = hasFilter ? 'Search Results' : 'All Courses';

  showLoading();

  // Build query string
  const params = new URLSearchParams();
  if (name)   params.set('q',        name);
  if (cat)    params.set('category', cat);
  if (rating) params.set('rating',   rating);
  if (price !== 'all') params.set('price', price);

  try {
    const res  = await fetch(`${API_BASE}/api/courses/search?${params.toString()}`);
    if (!res.ok) throw new Error(`Server responded with ${res.status}`);
    const data = await res.json();

    if (!data.success) throw new Error(data.message || 'Unknown error');

    if (data.courses.length === 0) {
      showEmpty();
      return;
    }

    document.getElementById('results').innerHTML = data.courses.map(renderCard).join('');
    setCount(data.total);

  } catch (err) {
    showError(err.message);
  }
}

// ── Sync nav → filter and search ─────────────────────────────────────────────
function syncAndSearch(val) {
  document.getElementById('filterName').value = val;
  doSearch();
}

// ── Clear filters ─────────────────────────────────────────────────────────────
function clearFilters() {
  document.getElementById('filterName').value   = '';
  document.getElementById('filterCat').value    = '';
  document.getElementById('filterRating').value = '';
  document.querySelector('input[name="price"][value="all"]').checked = true;
  document.getElementById('navSearch').value    = '';
  doSearch();
}

// ── URL query param support (?q=...) ─────────────────────────────────────────
function readURLQuery() {
  const q = new URLSearchParams(window.location.search).get('q');
  if (q) {
    document.getElementById('filterName').value = q;
    document.getElementById('navSearch').value  = q;
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
readURLQuery();
loadCategories();
doSearch();
</script>
</body>
</html>
