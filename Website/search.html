<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartKids – Search Courses</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .page-wrap { max-width:860px; margin:40px auto; padding:0 24px 60px; }
    .page-title { font-family:'Nunito',sans-serif; font-size:1.8rem; font-weight:900; color:var(--blue-mid); text-align:center; margin-bottom:28px; }
    .filter-box { background:white; border-radius:16px; border:1px solid var(--border); padding:24px 28px; margin-bottom:32px; box-shadow: var(--shadow); }
    .filter-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px 24px; }
    .filter-group label { font-size:.82rem; font-weight:600; color:var(--gray); display:block; margin-bottom:6px; }
    .filter-group input, .filter-group select { width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:.85rem; font-family:'Poppins',sans-serif; background:var(--gray-light); outline:none; transition: border-color .2s; }
    .filter-group input:focus, .filter-group select:focus { border-color:var(--blue-mid); background:white; }
    .filter-row { display:flex; align-items:center; gap:20px; margin-top:16px; }
    .radio-label { display:flex; align-items:center; gap:6px; font-size:.85rem; cursor:pointer; color:var(--dark); }
    .filter-row .btn { margin-left:auto; }
    .results-title { font-family:'Nunito',sans-serif; font-size:1.1rem; font-weight:800; color:var(--blue-mid); margin-bottom:16px; }
    .result-card { display:flex; align-items:center; gap:20px; background:white; border:1px solid var(--border); border-radius:14px; padding:16px 20px; margin-bottom:14px; text-decoration:none; color:inherit; transition: transform .2s, box-shadow .2s; box-shadow: var(--shadow); }
    .result-card:hover { transform:translateX(4px); box-shadow:0 6px 20px rgba(37,99,235,.1); }
    .result-thumb { width:90px; height:70px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:2rem; flex-shrink:0; }
    .result-info { flex:1; }
    .result-info h3 { font-size:1rem; font-weight:700; color:var(--blue-mid); margin-bottom:4px; }
    .result-info .stars { font-size:.85rem; }
    .result-meta { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
    .badge { background:var(--blue-light); color:var(--blue); font-size:.75rem; font-weight:600; padding:3px 10px; border-radius:999px; }
    .price-tag { background:var(--blue-mid); color:white; font-size:.8rem; font-weight:700; padding:4px 12px; border-radius:999px; }
    
    .not-found-box { display: flex; justify-content: center; align-items: center; min-height: 200px; font-family: 'Nunito', sans-serif; font-size: 1.6rem; font-weight: 800; color: var(--gray); background: var(--white); border-radius: 16px; border: 1px dashed var(--border); margin-top: 20px; }
  </style>
</head>
<body>
<nav>
  <a href="Home.html" class="logo"><img src="../Elements/LOGO-removebg-preview.png" alt="SmartKids Logo" style="height: 85px; width: auto;"></a>
  <div class="search-bar">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="navSearch" placeholder="Search Courses" 
           ondblclick="window.location.href='search.html';"
           onkeydown="if(event.key==='Enter'){document.getElementById('filterName').value=this.value; doSearch();}"/>
  </div>
  <div class="nav-right">
    <a href="members.html" class="nav-link">Members</a>
    <a href="search.html" class="nav-link">COURSES</a>
    <a href="login.html" class="nav-link">LOG-IN / SIGN-UP</a>
    <a href="admin-login.html" title="Admin">
      <img src="../Elements/Admin_logo-removebg-preview.png" alt="Admin Logo" style="height: 40px; width: auto;">
    </a>
  </div>
</nav>

<div class="page-wrap">
  <h1 class="page-title">Online Course Search</h1>

  <div class="filter-box">
    <div class="filter-grid">
      <div class="filter-group">
        <label>Course Name:</label>
        <input type="text" id="filterName" placeholder="e.g. Biology" onkeydown="if(event.key==='Enter'){document.getElementById('navSearch').value=this.value; doSearch();}"/>
      </div>
      <div class="filter-group">
        <label>Category:</label>
        <select id="filterCat">
          <option value="">All Categories</option>
          <option>Upskill Course</option>
          <option>Mathematics</option>
          <option>Science</option>
          <option>Language</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Rating:</label>
        <select id="filterRating">
          <option value="">Any Rating</option>
          <option value="4">4★ &amp; above</option>
          <option value="5">5★ only</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Price:</label>
        <div class="filter-row" style="margin-top:0;">
          <label class="radio-label"><input type="radio" name="price" value="all" checked/> All</label>
          <label class="radio-label"><input type="radio" name="price" value="free"/> Free</label>
          <label class="radio-label"><input type="radio" name="price" value="paid"/> Paid</label>
        </div>
      </div>
    </div>
    <div style="text-align:right; margin-top:16px;">
      <button class="btn btn-primary btn-sm" onclick="doSearch()">Search</button>
    </div>
  </div>

  <div class="results-title" id="resultsTitle">Search Results</div>
  <div id="results"></div>
</div>

<footer>
  <a href="Home.html" class="logo"><img src="../Elements/LOGO-removebg-preview.png" alt="SmartKids Logo for Footer" style="height: 95px; width: auto;"></a>
  <div class="footer-contact">
    <p><strong>For inquiries, please contact (Admin)</strong></p>
    <p>Tel xxx-xxx-xxxx</p>
    <p>From 10:00 AM to 8:00 PM.</p>
  </div>
  <div class="footer-links">
    <a href="#">Privacy Notice</a>
    <a href="members.html">Team Member</a>
    <a href="#">Contact Us</a>
  </div>
</footer>

<script>
const allCourses = [
  { id:'B11001', name:'Biology', rating:5, cat:'Upskill Course', price:2290, icon:'🌿', bg:'linear-gradient(135deg,#1a3a2a,#16a34a)' },
  { id:'P11345', name:'Physics', rating:4, cat:'Upskill Course', price:2290, icon:'⚛️', bg:'linear-gradient(135deg,#1e3a4a,#0ea5e9)' },
  { id:'C0345', name:'Chemistry', rating:4, cat:'Upskill Course', price:2290, icon:'🧪', bg:'linear-gradient(135deg,#3a1a2a,#db2777)' },
  { id:'M11345', name:'Mathematics', rating:5, cat:'Mathematics', price:1990, icon:'📐', bg:'linear-gradient(135deg,#1e3a5f,#2563eb)' },
  { id:'E10001', name:'English', rating:5, cat:'Language', price:1890, icon:'📝', bg:'linear-gradient(135deg,#3a2a1a,#d97706)' },
];

function getSearchQueryFromURL() {
  const urlParams = new URLSearchParams(window.location.search);
  const query = urlParams.get('q');
  if (query !== null) {
    document.getElementById('navSearch').value = query;
    document.getElementById('filterName').value = query;
  }
}

function renderCard(c) {
  return `<a href="description.html?id=${c.id}&name=${encodeURIComponent(c.name)}" class="result-card fade-in">
    <div class="result-thumb" style="background:${c.bg}">${c.icon}</div>
    <div class="result-info">
      <h3>${c.name}</h3>
      <div>Rating</div>
      <div class="stars">${'★'.repeat(c.rating)}${'☆'.repeat(5-c.rating)} ${c.rating}</div>
    </div>
    <div class="result-meta">
      <span class="badge">${c.cat}</span>
      <span class="price-tag">${c.price.toLocaleString()} Baht</span>
      <span class="btn btn-primary btn-sm">View Details</span>
    </div>
  </a>`;
}

function doSearch() {
  let nameInput = document.getElementById('filterName').value;
  document.getElementById('navSearch').value = nameInput;
  
  const name = nameInput.toLowerCase();
  const cat = document.getElementById('filterCat').value;
  const rating = document.getElementById('filterRating').value;
  const price = document.querySelector('input[name="price"]:checked').value;
  
  const filtered = allCourses.filter(c => {
    if (name && !c.name.toLowerCase().includes(name)) return false;
    if (cat && c.cat !== cat) return false;
    if (rating && c.rating < parseInt(rating)) return false;
    if (price === 'free' && c.price > 0) return false;
    if (price === 'paid' && c.price === 0) return false;
    return true;
  });

  // เช็คว่าถ้าช่องค้นหาว่างเปล่า (คือดูคอร์สทั้งหมด) ให้เปลี่ยนหัวข้อเป็น "Courses"
  const titleEl = document.getElementById('resultsTitle');
  if (!name && !cat && !rating && price === 'all') {
    titleEl.textContent = 'Courses';
  } else {
    titleEl.textContent = 'Search Results';
  }

  document.getElementById('results').innerHTML = filtered.length
    ? filtered.map(renderCard).join('')
    : '<div class="not-found-box fade-in">Not found</div>';
}

getSearchQueryFromURL();
doSearch(); 
</script>
</body>
</html>
